name: stock-watch
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; runs can lag a few minutes)
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-
      - run: python3 stock_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy-me.com
          STATE_FILE: state.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
